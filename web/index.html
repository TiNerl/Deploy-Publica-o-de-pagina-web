<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RE:Vendas</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <div class="container">
            <h1><a href="#">RE:Vendas</a></h1>
            <nav>
                <ul>
                    <li><a href="#home">Home</a></li>
                    <li><a href="#products">Products</a></li>
                    <li><a href="#about">About Us</a></li>
                    <li><a href="#contact">Contact</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <section id="hero">
        <div class="container">
            <h2>Welcome to RE:Vendas</h2>
            <p>Your one-stop online marketplace for unique and high-quality products.</p>
            <a href="#products" class="btn">Shop Now</a>
        </div>
    </section>

    <section id="products">
        <div class="container">
            <h3>Featured Products</h3>
            <div class="product-grid">
                <div class="product-item">
                    <img src="images/product1.jpg" alt="Product 1">
                    <h4>Product Name 1</h4>
                    <p>$99.99</p>
                    <a href="#" class="btn">Buy Now</a>
                </div>
                <div class="product-item">
                    <img src="images/product2.jpg" alt="Product 2">
                    <h4>Product Name 2</h4>
                    <p>$149.99</p>
                    <a href="#" class="btn">Buy Now</a>
                </div>
                <!-- Add more product items as needed -->
            </div>
        </div>
    </section>

    <footer>
        <div class="container">
            <p>&copy; 2023 RE:Vendas. All rights reserved.</p>
        </div>
    </footer>
</body>
</html>
