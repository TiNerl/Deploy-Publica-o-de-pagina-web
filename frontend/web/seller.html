<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#ffe600">
    <title>Painel do vendedor — RE:Vendas</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="flow-page">
    <header class="flow-header"><a class="brand" href="index.html"><span class="brand-mark">R</span><span>RE:<strong>Vendas</strong></span></a><a class="text-link" href="index.html">Voltar à vitrine</a></header>
    <main class="flow-container seller-dashboard">
        <span class="eyebrow">ÁREA EXCLUSIVA</span><h1>Painel do vendedor</h1>
        <p class="flow-lead">Gerencie seu catálogo, cupons e pedidos.</p>
        <section id="seller-login" class="flow-card">
            <h2>Acesso do vendedor</h2>
            <p>Conta de demonstração: <code>vendedor@revendas.test</code> / <code>vendedor123</code></p>
            <form id="seller-login-form" class="stack-form">
                <label>E-mail<input name="email" type="email" required value="vendedor@revendas.test" autocomplete="username"></label>
                <label>Senha<input name="password" type="password" required value="vendedor123" autocomplete="current-password"></label>
                <button class="button button-dark" type="submit">Entrar no painel</button>
            </form>
        </section>
        <div id="seller-area" hidden>
            <div class="seller-tools">
                <form id="product-form" class="flow-card stack-form">
                    <h2>Adicionar produto</h2>
                    <label>Nome<input name="name" required minlength="2"></label>
                    <label>Categoria (ex.: casa)<input name="category" required pattern="[a-z0-9-]{2,30}"></label>
                    <label>Preço (R$)<input name="price" type="number" required min="0.01" step="0.01"></label>
                    <label>Estoque<input name="stock" type="number" required min="1" value="1"></label>
                    <label>URL da imagem (opcional)<input name="image" type="url"></label>
                    <button class="button button-dark" type="submit">Publicar produto</button>
                </form>
                <form id="seller-coupon-form" class="flow-card stack-form">
                    <h2>Criar cupom</h2>
                    <label>Código<input name="code" required minlength="3" maxlength="20"></label>
                    <label>Desconto (%)<input name="value" type="number" required min="1" max="90" value="10"></label>
                    <button class="button button-dark" type="submit">Criar cupom da loja</button>
                </form>
            </div>
            <section class="flow-card"><h2>Meus produtos</h2><div id="seller-products" class="seller-list"></div></section>
            <section class="flow-card"><h2>Cupons ativos</h2><div id="seller-coupons" class="seller-list"></div></section>
            <section class="flow-card"><h2>Pedidos e notas fiscais demonstrativas</h2><div id="seller-orders" class="order-list"></div></section>
        </div>
        <p id="seller-feedback" class="flow-feedback" role="status"></p>
    </main>
    <script src="api.js" defer></script>
    <script src="seller.js" defer></script>
</body>
</html>
